[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framewise-video-analyzer"
version = "1.0.0"
description = "Offline transcript analysis with optional Whisper, BLIP, OpenAI, and Gemini adapters"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "python-dotenv>=1.0,<2"]

[project.scripts]
framewise = "video_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
